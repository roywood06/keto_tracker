<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keto Macro Tracker</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --accent:#5fd97a; --accent2:#f2b134;
    --text:#e9edf1; --muted:#8b93a1; --danger:#e5534b; --border:#2b303a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header{padding:18px 20px;background:linear-gradient(135deg,#14321f,#0f1115);border-bottom:1px solid var(--border);}
  header h1{margin:0;font-size:22px;}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  .container{max-width:1100px;margin:0 auto;padding:16px;}
  .weekbar{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;}
  .daybtn{flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:13px;white-space:nowrap;}
  .daybtn.active{background:var(--accent);color:#08210f;font-weight:600;border-color:var(--accent);}
  .grid{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-top:12px;}
  @media(max-width:850px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:14px;}
  .card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;justify-content:space-between;}
  .meal-total{font-size:12px;color:var(--muted);font-weight:400;}
  .entry{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--card2);border-radius:8px;margin-bottom:6px;font-size:13px;}
  .entry .meta{color:var(--muted);font-size:12px;}
  .entry .del{cursor:pointer;color:var(--danger);font-weight:700;margin-left:8px;background:none;border:none;font-size:15px;}
  .addform{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .addform input[type=text]{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--text);font-size:13px;}
  .row{display:flex;gap:8px;}
  .row input{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--text);font-size:13px;}
  .row label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px;}
  .col{flex:1;}
  button.primary{background:var(--accent);color:#08210f;border:none;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;}
  button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;}
  .estimate-row{display:flex;gap:8px;align-items:center;}
  .fileinput{font-size:12px;color:var(--muted);}
  .thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;margin-right:8px;}
  .entry-left{display:flex;align-items:center;}
  .totals-card .macro{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .macro .label{font-size:13px;color:var(--muted);}
  .macro .val{font-size:15px;font-weight:600;}
  .barbg{height:8px;background:var(--card2);border-radius:5px;overflow:hidden;margin-top:4px;}
  .barfill{height:100%;border-radius:5px;}
  .targets-edit{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .targets-edit input{width:70px;padding:6px;border-radius:6px;border:1px solid var(--border);background:#0f1115;color:var(--text);font-size:12px;}
  .targets-edit label{font-size:11px;color:var(--muted);display:block;}
  .small-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .weeksummary{font-size:12px;color:var(--muted);margin-top:6px;}
  .badge{background:var(--accent2);color:#2a1c02;font-size:10px;padding:2px 6px;border-radius:6px;margin-left:6px;}
  select{padding:8px;border-radius:8px;border:1px solid var(--border);background:#0f1115;color:var(--text);font-size:13px;}
  .toggle{display:flex;gap:6px;margin-bottom:8px;}
  .toggle button{flex:1;padding:6px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--muted);font-size:12px;cursor:pointer;}
  .toggle button.on{background:var(--accent);color:#08210f;border-color:var(--accent);}
  img.preview{max-width:100%;border-radius:8px;margin-top:6px;display:none;}
</style>
</head>
<body>
<header>
  <h1>🥑 Keto Macro Tracker</h1>
  <p>Weekly running totals for calories, protein, fat, total carbs &amp; net carbs</p>
</header>

<div class="container">
  <div class="card">
    <div class="row" style="align-items:center;">
      <div class="col">
        <label style="font-size:11px;color:var(--muted);">Week starting (Sunday)</label>
        <input type="date" id="weekStart">
      </div>
      <div class="col" style="display:flex;align-items:flex-end;">
        <button class="secondary" onclick="resetWeekToToday()">Jump to current week</button>
      </div>
    </div>
    <div class="weekbar" id="weekbar"></div>
  </div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>Add Food <span class="meal-total" id="addHint">estimate by description</span></h2>
        <div class="toggle">
          <button id="mealBreakfast" class="mealSel">Breakfast</button>
          <button id="mealLunch" class="mealSel">Lunch</button>
          <button id="mealDinner" class="mealSel">Dinner</button>
          <button id="mealSnack" class="mealSel on">Snacks</button>
        </div>
        <div class="addform">
          <input type="text" id="foodDesc" placeholder="Describe the food (e.g. '2 fried eggs with 1 tbsp butter and 2 slices bacon')">
          <div class="estimate-row">
            <input type="file" id="foodPhoto" accept="image/*" class="fileinput">
            <button class="secondary" onclick="estimateMacros()">Estimate Macros</button>
          </div>
          <img id="photoPreview" class="preview">
          <div class="row">
            <div class="col"><label>Calories</label><input type="number" id="mCal"></div>
            <div class="col"><label>Protein (g)</label><input type="number" id="mProt"></div>
            <div class="col"><label>Fat (g)</label><input type="number" id="mFat"></div>
            <div class="col"><label>Total Carbs (g)</label><input type="number" id="mTC"></div>
            <div class="col"><label>Net Carbs (g)</label><input type="number" id="mNC"></div>
          </div>
          <button class="primary" onclick="addEntry()">Add to log</button>
          <div class="small-note" id="estimateNote"></div>
        </div>
      </div>

      <div class="card"><h2>Breakfast <span class="meal-total" id="totBreakfast"></span></h2><div id="listBreakfast"></div></div>
      <div class="card"><h2>Lunch <span class="meal-total" id="totLunch"></span></h2><div id="listLunch"></div></div>
      <div class="card"><h2>Dinner <span class="meal-total" id="totDinner"></span></h2><div id="listDinner"></div></div>
      <div class="card"><h2>Snacks <span class="meal-total" id="totSnack"></span></h2><div id="listSnack"></div></div>
    </div>

    <div>
      <div class="card totals-card">
        <h2>Today's Totals</h2>
        <div id="dayTotals"></div>
      </div>
      <div class="card totals-card">
        <h2>Week Running Totals</h2>
        <div id="weekTotals"></div>
        <div class="weeksummary" id="weekAvg"></div>
      </div>
      <div class="card">
        <h2>Daily Keto Targets</h2>
        <div class="targets-edit" id="targetsEdit"></div>
        <button class="secondary" style="margin-top:8px;" onclick="saveTargets()">Save targets</button>
      </div>
    </div>
  </div>
</div>

<script>
const MEALS=["Breakfast","Lunch","Dinner","Snack"];
let state=JSON.parse(localStorage.getItem('ketoTrackerState')||'{}');
if(!state.entries) state.entries={};
if(!state.targets) state.targets={cal:1800,prot:110,fat:140,tc:30,nc:20};
let selectedMeal="Snack";
let currentDay=null;

function save(){localStorage.setItem('ketoTrackerState',JSON.stringify(state));}

function fmtDate(d){return d.toISOString().slice(0,10);}

function getSunday(d){
  const dt=new Date(d);
  dt.setDate(dt.getDate()-dt.getDay());
  dt.setHours(0,0,0,0);
  return dt;
}

function resetWeekToToday(){
  const s=getSunday(new Date());
  document.getElementById('weekStart').value=fmtDate(s);
  renderWeekbar();
}

function renderWeekbar(){
  const startVal=document.getElementById('weekStart').value;
  const start=startVal?new Date(startVal+'T00:00:00'):getSunday(new Date());
  const bar=document.getElementById('weekbar');
  bar.innerHTML='';
  let firstDay=null;
  for(let i=0;i<7;i++){
    const d=new Date(start);
    d.setDate(d.getDate()+i);
    const key=fmtDate(d);
    if(!firstDay) firstDay=key;
    const btn=document.createElement('button');
    btn.className='daybtn'+(key===currentDay?' active':'');
    btn.textContent=d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    btn.onclick=()=>{currentDay=key;renderAll();};
    bar.appendChild(btn);
  }
  if(!currentDay || !isDayInWeek(currentDay,start)) currentDay=firstDay;
  renderAll();
}

function isDayInWeek(dayKey,start){
  const d=new Date(dayKey+'T00:00:00');
  const diff=(d-start)/86400000;
  return diff>=0 && diff<7;
}

document.querySelectorAll('.mealSel').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mealSel').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    selectedMeal=btn.textContent==='Snacks'?'Snack':btn.textContent;
  });
});

document.getElementById('foodPhoto').addEventListener('change',function(e){
  const file=e.target.files[0];
  const prev=document.getElementById('photoPreview');
  if(file){
    const reader=new FileReader();
    reader.onload=ev=>{prev.src=ev.target.result;prev.style.display='block';};
    reader.readAsDataURL(file);
  } else {
    prev.style.display='none';
  }
});

async function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const result=reader.result;
      const base64=result.split(',')[1];
      resolve(base64);
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function estimateMacros(){
  const desc=document.getElementById('foodDesc').value.trim();
  const fileInput=document.getElementById('foodPhoto');
  const file=fileInput.files[0];
  const note=document.getElementById('estimateNote');
  const btn=document.querySelector('.estimate-row button');

  if(!desc && !file){
    note.textContent="Enter a description or attach a photo first.";
    return;
  }

  note.textContent="Estimating macros with AI…";
  if(btn){btn.disabled=true;btn.textContent="Estimating…";}

  try{
    const payload={description:desc||undefined};
    if(file){
      payload.imageBase64=await fileToBase64(file);
      payload.imageMime=file.type||"image/jpeg";
    }

    const resp=await fetch('/.netlify/functions/estimate-macros',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    const data=await resp.json();

    if(!resp.ok || !data.macros){
      note.textContent="Estimate failed: "+(data.error?(typeof data.error==='string'?data.error:JSON.stringify(data.error)):"Unknown error")+". You can enter macros manually below.";
      return;
    }

    const m=data.macros;
    document.getElementById('mCal').value=Math.round(m.calories||0);
    document.getElementById('mProt').value=Math.round((m.protein_g||0)*10)/10;
    document.getElementById('mFat').value=Math.round((m.fat_g||0)*10)/10;
    document.getElementById('mTC').value=Math.round((m.total_carbs_g||0)*10)/10;
    document.getElementById('mNC').value=Math.round((m.net_carbs_g||0)*10)/10;
    note.textContent="AI estimate: "+(m.notes||"Values are approximate — adjust as needed.");
  } catch(err){
    note.textContent="Estimate failed: "+err.message+". Check your connection or enter macros manually.";
  } finally {
    if(btn){btn.disabled=false;btn.textContent="Estimate Macros";}
  }
}

function addEntry(){
  if(!currentDay){alert('Select a day first');return;}
  const desc=document.getElementById('foodDesc').value.trim()||'(unnamed food)';
  const cal=parseFloat(document.getElementById('mCal').value)||0;
  const prot=parseFloat(document.getElementById('mProt').value)||0;
  const fat=parseFloat(document.getElementById('mFat').value)||0;
  const tc=parseFloat(document.getElementById('mTC').value)||0;
  const nc=parseFloat(document.getElementById('mNC').value)||0;
  const photo=document.getElementById('photoPreview').style.display==='block'?document.getElementById('photoPreview').src:null;
  if(!state.entries[currentDay]) state.entries[currentDay]=[];
  state.entries[currentDay].push({meal:selectedMeal,desc,cal,prot,fat,tc,nc,photo,id:Date.now()});
  save();
  document.getElementById('foodDesc').value='';
  document.getElementById('mCal').value='';document.getElementById('mProt').value='';
  document.getElementById('mFat').value='';document.getElementById('mTC').value='';document.getElementById('mNC').value='';
  document.getElementById('foodPhoto').value='';
  document.getElementById('photoPreview').style.display='none';
  document.getElementById('estimateNote').textContent='';
  renderAll();
}

function deleteEntry(id){
  state.entries[currentDay]=state.entries[currentDay].filter(e=>e.id!==id);
  save();
  renderAll();
}

function sumMacros(list){
  return list.reduce((a,e)=>({cal:a.cal+e.cal,prot:a.prot+e.prot,fat:a.fat+e.fat,tc:a.tc+e.tc,nc:a.nc+e.nc}),{cal:0,prot:0,fat:0,tc:0,nc:0});
}

function renderMealList(meal,containerId,totalId){
  const list=(state.entries[currentDay]||[]).filter(e=>e.meal===meal);
  const cont=document.getElementById(containerId);
  cont.innerHTML='';
  list.forEach(e=>{
    const div=document.createElement('div');
    div.className='entry';
    div.innerHTML=`<div class="entry-left">${e.photo?`<img src="${e.photo}" class="thumb">`:''}<div><div>${e.desc}</div><div class="meta">${Math.round(e.cal)} cal · P${Math.round(e.prot)} F${Math.round(e.fat)} TC${Math.round(e.tc)} NC${Math.round(e.nc)}</div></div></div><button class="del" onclick="deleteEntry(${e.id})">×</button>`;
    cont.appendChild(div);
  });
  const t=sumMacros(list);
  document.getElementById(totalId).textContent=`${Math.round(t.cal)} cal`;
}

function macroBar(label,val,target,color){
  const pct=target?Math.min(100,(val/target)*100):0;
  return `<div class="macro"><div><div class="label">${label}</div><div class="barbg"><div class="barfill" style="width:${pct}%;background:${color};"></div></div></div><div class="val">${Math.round(val*10)/10}${target?' / '+target:''}</div></div>`;
}

function renderTotalsBlock(elId,totals,showTargets){
  const t=state.targets;
  let html='';
  html+=macroBar('Calories',totals.cal,showTargets?t.cal:null,'#5fd97a');
  html+=macroBar('Protein (g)',totals.prot,showTargets?t.prot:null,'#4fa8f0');
  html+=macroBar('Fat (g)',totals.fat,showTargets?t.fat:null,'#f2b134');
  html+=macroBar('Total Carbs (g)',totals.tc,showTargets?t.tc:null,'#e5534b');
  html+=macroBar('Net Carbs (g)',totals.nc,showTargets?t.nc:null,'#e5534b');
  document.getElementById(elId).innerHTML=html;
}

function renderTargetsEdit(){
  const t=state.targets;
  const el=document.getElementById('targetsEdit');
  el.innerHTML=`
   <div><label>Calories</label><input id="tCal" type="number" value="${t.cal}"></div>
   <div><label>Protein g</label><input id="tProt" type="number" value="${t.prot}"></div>
   <div><label>Fat g</label><input id="tFat" type="number" value="${t.fat}"></div>
   <div><label>Total Carbs g</label><input id="tTC" type="number" value="${t.tc}"></div>
   <div><label>Net Carbs g</label><input id="tNC" type="number" value="${t.nc}"></div>`;
}

function saveTargets(){
  state.targets={
    cal:parseFloat(document.getElementById('tCal').value)||0,
    prot:parseFloat(document.getElementById('tProt').value)||0,
    fat:parseFloat(document.getElementById('tFat').value)||0,
    tc:parseFloat(document.getElementById('tTC').value)||0,
    nc:parseFloat(document.getElementById('tNC').value)||0,
  };
  save();
  renderAll();
}

function renderAll(){
  document.querySelectorAll('.daybtn').forEach(b=>b.classList.remove('active'));
  renderWeekbarActive();
  renderMealList('Breakfast','listBreakfast','totBreakfast');
  renderMealList('Lunch','listLunch','totLunch');
  renderMealList('Dinner','listDinner','totDinner');
  renderMealList('Snack','listSnack','totSnack');

  const dayList=state.entries[currentDay]||[];
  const dayTotals=sumMacros(dayList);
  renderTotalsBlock('dayTotals',dayTotals,true);

  const start=new Date(document.getElementById('weekStart').value+'T00:00:00');
  let weekList=[];
  for(let i=0;i<7;i++){
    const d=new Date(start); d.setDate(d.getDate()+i);
    const key=fmtDate(d);
    weekList=weekList.concat(state.entries[key]||[]);
  }
  const weekTotals=sumMacros(weekList);
  renderTotalsBlock('weekTotals',weekTotals,false);
  document.getElementById('weekAvg').textContent=weekList.length?`Avg/day: ${Math.round(weekTotals.cal/7)} cal, P${Math.round(weekTotals.prot/7)}g, F${Math.round(weekTotals.fat/7)}g, NC${Math.round(weekTotals.nc/7)}g`:'No entries yet this week.';

  renderTargetsEdit();
}

function renderWeekbarActive(){
  const bar=document.getElementById('weekbar');
  Array.from(bar.children).forEach((btn,i)=>{
    const start=new Date(document.getElementById('weekStart').value+'T00:00:00');
    const d=new Date(start); d.setDate(d.getDate()+i);
    if(fmtDate(d)===currentDay) btn.classList.add('active'); else btn.classList.remove('active');
  });
}

document.getElementById('weekStart').addEventListener('change',renderWeekbar);
resetWeekToToday();
</script>
</body>
</html>
